<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Care Game - เกมดูแลแมวน่ารัก</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            color: #4a4a4a;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .boy-info {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: #f8f9ff;
            padding: 15px;
            border-radius: 15px;
            border: 3px solid #e0e6ff;
        }

        .boy-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffeaa7, #fab1a0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            margin-right: 15px;
            border: 3px solid #fff;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            background: #f1f3f4;
            padding: 15px;
            border-radius: 15px;
        }

        .status-item {
            text-align: center;
            font-weight: bold;
        }

        .status-item .label {
            font-size: 0.9em;
            color: #666;
        }

        .status-item .value {
            font-size: 1.2em;
            color: #2d3436;
        }

        .cats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .cat-card {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 3px solid #e0e6ff;
            transition: transform 0.3s ease;
        }

        .cat-card:hover {
            transform: translateY(-5px);
        }

        .cat-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            border: 3px solid #fff;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .cat-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2d3436;
        }

        .cat-stats {
            margin-bottom: 15px;
        }

        .stat-bar {
            background: #e0e6ff;
            height: 20px;
            border-radius: 10px;
            margin: 5px 0;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .happiness-bar { background: #55efc4; }
        .hunger-bar { background: #fd79a8; }

        .cat-actions {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .action-btn {
            background: linear-gradient(45deg, #74b9ff, #0984e3);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .action-btn:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            transform: none;
        }

        .shop-section {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .shop-title {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2d3436;
        }

        .shop-items {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .shop-item {
            text-align: center;
            margin: 10px;
        }

        .shop-btn {
            background: linear-gradient(45deg, #a29bfe, #6c5ce7);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .shop-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .shop-btn:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            transform: none;
        }

        .controls {
            text-align: center;
            margin-top: 20px;
        }

        .reset-btn {
            background: linear-gradient(45deg, #fd79a8, #e84393);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .loading {
            text-align: center;
            font-size: 1.2em;
            color: #666;
            margin: 20px 0;
        }

        .message {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            .cats-container {
                grid-template-columns: 1fr;
            }
            
            .shop-items {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🐱 Cat Care Game 🐱</h1>
            <p>เกมดูแลแมวน่ารัก</p>
        </div>

        <div class="boy-info">
            <div class="boy-avatar">👦</div>
            <div>
                <h3 id="boyName">Tommy</h3>
                <p>เด็กชายผู้รักแมว</p>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="label">🪙 Coins</div>
                <div class="value" id="coins">100</div>
            </div>
            <div class="status-item">
                <div class="label">🍖 Food</div>
                <div class="value" id="food">10</div>
            </div>
            <div class="status-item">
                <div class="label">🧸 Toys</div>
                <div class="value" id="toys">5</div>
            </div>
            <div class="status-item">
                <div class="label">🍪 Treats</div>
                <div class="value" id="treats">3</div>
            </div>
        </div>

        <div id="message" class="message" style="display: none;"></div>

        <div class="cats-container" id="catsContainer">
            <!-- Cats will be dynamically loaded here -->
        </div>

        <div class="shop-section">
            <div class="shop-title">🏪 Pet Shop</div>
            <div class="shop-items">
                <div class="shop-item">
                    <div>🍖 Food</div>
                    <div>5 coins</div>
                    <button class="shop-btn" onclick="buyItem('food')">Buy</button>
                </div>
                <div class="shop-item">
                    <div>🧸 Toy</div>
                    <div>10 coins</div>
                    <button class="shop-btn" onclick="buyItem('toys')">Buy</button>
                </div>
                <div class="shop-item">
                    <div>🍪 Treat</div>
                    <div>15 coins</div>
                    <button class="shop-btn" onclick="buyItem('treats')">Buy</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="reset-btn" onclick="resetGame()">🔄 Reset Game</button>
        </div>
    </div>

    <script>
        let gameState = null;
        let isLoading = false;

        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        function updateUI() {
            if (!gameState) return;
            
            // Update status bar
            document.getElementById('coins').textContent = gameState.coins;
            document.getElementById('food').textContent = gameState.items.food;
            document.getElementById('toys').textContent = gameState.items.toys;
            document.getElementById('treats').textContent = gameState.items.treats;
            
            // Update cats
            const catsContainer = document.getElementById('catsContainer');
            catsContainer.innerHTML = '';
            
            gameState.cats.forEach(cat => {
                const catCard = document.createElement('div');
                catCard.className = 'cat-card';
                catCard.innerHTML = `
                    <div class="cat-avatar" style="background: ${cat.color}">🐱</div>
                    <div class="cat-name">${cat.name}</div>
                    <div class="cat-stats">
                        <div>😊 Happiness: ${cat.happiness}%</div>
                        <div class="stat-bar">
                            <div class="stat-fill happiness-bar" style="width: ${cat.happiness}%"></div>
                        </div>
                        <div>🍽️ Hunger: ${cat.hunger}%</div>
                        <div class="stat-bar">
                            <div class="stat-fill hunger-bar" style="width: ${cat.hunger}%"></div>
                        </div>
                    </div>
                    <div class="cat-actions">
                        <button class="action-btn" onclick="feedCat(${cat.id})" 
                                ${gameState.items.food <= 0 ? 'disabled' : ''}>
                            🍖 Feed
                        </button>
                        <button class="action-btn" onclick="playCat(${cat.id})" 
                                ${gameState.items.toys <= 0 ? 'disabled' : ''}>
                            🧸 Play
                        </button>
                        <button class="action-btn" onclick="giveTreat(${cat.id})" 
                                ${gameState.items.treats <= 0 ? 'disabled' : ''}>
                            🍪 Treat
                        </button>
                    </div>
                `;
                catsContainer.appendChild(catCard);
            });
        }

        function loadGame() {
            if (isLoading) return;
            isLoading = true;
            
            google.script.run
                .withSuccessHandler(function(result) {
                    gameState = result;
                    updateUI();
                    isLoading = false;
                })
                .withFailureHandler(function(error) {
                    showMessage('Error loading game: ' + error, 'error');
                    isLoading = false;
                })
                .loadGameState();
        }

        function feedCat(catId) {
            if (isLoading) return;
            isLoading = true;
            
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        gameState = result.gameState;
                        updateUI();
                        showMessage('Cat fed successfully! 🍖', 'success');
                    } else {
                        showMessage(result.message || 'Failed to feed cat', 'error');
                    }
                    isLoading = false;
                })
                .withFailureHandler(function(error) {
                    showMessage('Error: ' + error, 'error');
                    isLoading = false;
                })
                .feedCat(catId);
        }

        function playCat(catId) {
            if (isLoading) return;
            isLoading = true;
            
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        gameState = result.gameState;
                        updateUI();
                        showMessage('Cat is happy playing! 🧸', 'success');
                    } else {
                        showMessage(result.message || 'Failed to play with cat', 'error');
                    }
                    isLoading = false;
                })
                .withFailureHandler(function(error) {
                    showMessage('Error: ' + error, 'error');
                    isLoading = false;
                })
                .playCat(catId);
        }

        function giveTreat(catId) {
            if (isLoading) return;
            isLoading = true;
            
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        gameState = result.gameState;
                        updateUI();
                        showMessage('Cat loves the treat! 🍪', 'success');
                    } else {
                        showMessage(result.message || 'Failed to give treat', 'error');
                    }
                    isLoading = false;
                })
                .withFailureHandler(function(error) {
                    showMessage('Error: ' + error, 'error');
                    isLoading = false;
                })
                .giveTreat(catId);
        }

        function buyItem(itemType) {
            if (isLoading) return;
            isLoading = true;
            
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        gameState = result.gameState;
                        updateUI();
                        showMessage(`Bought ${itemType}! 🛒`, 'success');
                    } else {
                        showMessage(result.message || 'Failed to buy item', 'error');
                    }
                    isLoading = false;
                })
                .withFailureHandler(function(error) {
                    showMessage('Error: ' + error, 'error');
                    isLoading = false;
                })
                .buyItem(itemType);
        }

        function resetGame() {
            if (isLoading) return;
            if (!confirm('Are you sure you want to reset the game?')) return;
            
            isLoading = true;
            
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        gameState = result.gameState;
                        updateUI();
                        showMessage('Game reset successfully! 🔄', 'success');
                    } else {
                        showMessage('Failed to reset game', 'error');
                    }
                    isLoading = false;
                })
                .withFailureHandler(function(error) {
                    showMessage('Error: ' + error, 'error');
                    isLoading = false;
                })
                .resetGame();
        }

        // Load game when page loads
        window.onload = function() {
            loadGame();
        };

        // Auto-refresh every 30 seconds to update cat states
        setInterval(loadGame, 30000);
    </script>
</body>
</html>
